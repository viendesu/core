[workspace]
members = [
    "protocol/",
    "macros/",
    "core/",
    "http/",
    "auth/",
    "captcha/",
    "mcp/",
    "viendesu/",
]
resolver = "3"

[workspace.dependencies]
eva = { git = "ssh://forgejo@git.viende.su:61488/VienDesu/eva.git" }
eva-api-builder = { git = "ssh://forgejo@git.viende.su:61488/VienDesu/eva.git" }

futures = "0.3.31"
tokio = "1.44.2"
eyre = "0.6.12"

serde_json = "1.0.137"
serde_with = { version = "3.12.0", default-features = false, features = ["alloc", "macros"] }
serde = "1"

axum = { version = "0.8.4", default-features = false }
tower = "0.5"
http-body-util = "0.1"

viendesu-captcha = { path = "captcha/" }
viendesu-auth = { path = "auth/" }
viendesu-http = { path = "http/" }
viendesu-core = { path = "core/" }
viendesu-protocol = { path = "protocol/" }
viendesu-macros = { path = "macros/" }
viendesu-mcp = { path = "mcp/" }
