[package]
name = "viendesu-http"
version = "0.1.0"
edition = "2024"

[features]
default = []
server = [
    "format-serde",
    "dep:axum",
    "dep:tower-http",
    "dep:fastrace",
    "dep:futures",
    "eva/tokio",
    "tokio/net",
    "dep:fastrace-axum"
]
format-serde = ["dep:serde_json", "dep:serde_path_to_error", "dep:rmp-serde", "dep:rmp"]

[dependencies]
viendesu-core.workspace = true
viendesu-protocol.workspace = true

serde.workspace = true
serde_json = { workspace = true, optional = true, features = ["raw_value"] }
futures = { workspace = true, optional = true }

eva.workspace = true
eyre.workspace = true

axum = { workspace = true, optional = true, features = ["http1", "http2", "tokio", "multipart"] }
tower-http = { optional = true, version = "0.6.6", default-features = false, features = ["cors"] }
serde_path_to_error = { version = "0.1", optional = true }

rmp-serde = { version = "1.3", optional = true }
rmp = { version = "0.8.14", optional = true }

tokio = { workspace = true, optional = true }

fastrace = { optional = true, version = "0.7.9" }
fastrace-axum = { optional = true, version = "0.1.3" }

[dev-dependencies]
viendesu-http = { path = ".", features = ["server"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
serde_json.workspace = true
rmp-serde = "1.3"
futures.workspace = true
